name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --org com.ytpoints .
      - run: flutter pub get
      - name: Generate app icon from galaxy logo
        run: |
          if [ -f assets/yt_points_logo.png ]; then
            dart run flutter_launcher_icons
          else
            echo "Logo missing; upload assets/yt_points_logo.png to enable launcher icon"
          fi
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: yt-points-apk
          path: build/app/outputs/flutter-apk/app-release.apk
